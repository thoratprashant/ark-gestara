<section class="timeline-item-dialog w-100" aria-labelledby="timeline-item-dialog-title">
  <header
    class="timeline-item-dialog__header d-flex align-items-center justify-content-between m-0"
    mat-dialog-title
  >
    <h2 id="timeline-item-dialog-title" class="m-0 text-start text-nowrap fw-bold">
      {{ mode() === 'task' ? 'Add New Task' : 'Add New Medication' }}
    </h2>
    <button
      class="d-flex align-items-center justify-content-center p-0 border-0"
      type="button"
      mat-dialog-close
      aria-label="Close dialog"
    >
      <img
        class="d-block"
        [src]="
          mode() === 'task'
            ? 'assets/timeline-dialog/close-task.svg'
            : 'assets/timeline-dialog/close-medication.svg'
        "
        alt=""
        aria-hidden="true"
      />
    </button>
  </header>

  <form
    class="w-100"
    [formGroup]="mode() === 'task' ? taskForm : medicationForm"
    (ngSubmit)="submit()"
  >
    <mat-dialog-content class="timeline-item-dialog__body d-flex flex-column align-items-start">
      <div
        class="timeline-item-dialog__tabs d-flex w-100"
        [class.timeline-item-dialog__tabs--medication]="mode() === 'medication'"
        role="tablist"
        aria-label="Timeline item type"
      >
        <button
          class="d-flex align-items-center justify-content-center text-center text-nowrap fw-semibold"
          type="button"
          role="tab"
          [class.timeline-item-dialog__tab--active]="mode() === 'task'"
          [attr.aria-selected]="mode() === 'task'"
          (click)="setMode('task')"
        >
          Task
        </button>
        <button
          class="d-flex align-items-center justify-content-center text-center text-nowrap fw-semibold"
          type="button"
          role="tab"
          [class.timeline-item-dialog__tab--active]="mode() === 'medication'"
          [attr.aria-selected]="mode() === 'medication'"
          (click)="setMode('medication')"
        >
          Medication
        </button>
      </div>

      @if (mode() === 'task') {
        <div class="timeline-item-dialog__field d-flex flex-column align-items-start w-100">
          <label class="w-100 text-start text-uppercase fw-semibold" for="timeline-task-name"
            >Task Name</label
          >
          <input
            class="w-100 text-start fw-normal"
            id="timeline-task-name"
            type="text"
            formControlName="name"
            placeholder="e.g., Routine Prenatal Checkup"
          />
        </div>

        <div class="timeline-item-dialog__field d-flex flex-column align-items-start w-100">
          <label class="w-100 text-start text-uppercase fw-semibold">Week Range</label>
          <div class="timeline-item-dialog__range d-flex align-items-center w-100">
            <input
              class="text-start fw-normal"
              type="number"
              formControlName="startWeek"
              aria-label="Start week"
              min="0"
              max="40"
              step="0.5"
            />
            <span class="text-center text-uppercase fw-semibold">To</span>
            <input
              class="text-start fw-normal"
              type="number"
              formControlName="endWeek"
              aria-label="End week"
              min="0"
              max="40"
              step="0.5"
            />
          </div>
        </div>
      } @else {
        <div class="timeline-item-dialog__field d-flex flex-column align-items-start w-100">
          <label class="w-100 text-start text-uppercase fw-semibold" for="timeline-medication-name"
            >Medication Name</label
          >
          <input
            class="w-100 text-start fw-normal"
            id="timeline-medication-name"
            type="text"
            formControlName="name"
            placeholder="e.g., Metformin"
          />
        </div>

        <div class="timeline-item-dialog__field d-flex flex-column align-items-start w-100">
          <label
            class="w-100 text-start text-uppercase fw-semibold"
            for="timeline-medication-dosage"
            >Dosage</label
          >
          <input
            class="w-100 text-start fw-normal"
            id="timeline-medication-dosage"
            type="text"
            formControlName="dosage"
            placeholder="e.g., 500mg BID or 10/10"
          />
        </div>

        <div
          class="timeline-item-dialog__field timeline-item-dialog__field--start-week d-flex flex-column align-items-start w-100"
        >
          <label class="w-100 text-start fw-semibold" for="timeline-medication-start-week"
            ><span class="text-uppercase">Start Week</span
            ><span class="timeline-item-dialog__optional">(Optional)</span></label
          >
          <input
            class="text-start fw-normal"
            id="timeline-medication-start-week"
            type="number"
            formControlName="startWeek"
            min="0"
            max="40"
            step="0.5"
          />
          <small class="w-100 text-start fw-normal"
            >Medication will continue until end of pregnancy (40 weeks).</small
          >
        </div>
      }
    </mat-dialog-content>

    <mat-dialog-actions
      class="timeline-item-dialog__footer d-flex align-items-center justify-content-between flex-nowrap m-0"
    >
      <button
        class="d-flex align-items-center justify-content-center text-center text-nowrap fw-semibold"
        type="button"
        mat-dialog-close
      >
        Cancel
      </button>
      <button
        class="timeline-item-dialog__submit d-flex align-items-center justify-content-center text-center text-nowrap fw-semibold"
        type="submit"
      >
        {{ mode() === 'task' ? 'Add Task' : 'Add Medication' }}
      </button>
    </mat-dialog-actions>
  </form>
</section>
