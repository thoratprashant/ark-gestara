<section class="assign-problem-dialog w-100" aria-labelledby="assign-problem-dialog-title">
  <header
    class="assign-problem-dialog__header d-flex align-items-center justify-content-between m-0"
    mat-dialog-title
  >
    <h2 id="assign-problem-dialog-title" class="m-0 text-start text-nowrap fw-bold">
      Assign Problem
    </h2>
    <button
      class="assign-problem-dialog__icon-button d-flex align-items-center justify-content-center p-0 border-0"
      type="button"
      mat-dialog-close
      aria-label="Close Assign Problem dialog"
    >
      <img class="d-block" src="assets/problem-dialog/close.svg" alt="" aria-hidden="true" />
    </button>
  </header>

  <form class="assign-problem-dialog__form w-100" [formGroup]="form" (ngSubmit)="submit()">
    <mat-dialog-content
      class="assign-problem-dialog__body d-flex flex-column align-items-start w-100"
    >
      <div class="assign-problem-dialog__field d-flex flex-column align-items-start w-100">
        <label class="w-100 text-start text-uppercase fw-semibold" for="assign-problem-problem"
          >Problem</label
        >
        <span class="assign-problem-dialog__select d-block w-100">
          <select
            class="d-block w-100 fw-normal"
            id="assign-problem-problem"
            formControlName="problem"
          >
            @for (problem of problemOptions; track problem) {
              <option [value]="problem">{{ problem }}</option>
            }
          </select>
          <img src="assets/problem-dialog/chevron-down.svg" alt="" aria-hidden="true" />
        </span>
      </div>

      <div class="assign-problem-dialog__field d-flex flex-column align-items-start w-100">
        <label class="w-100 text-start text-uppercase fw-semibold" for="assign-problem-category"
          >Category</label
        >
        <span class="assign-problem-dialog__select d-block w-100">
          <select
            class="d-block w-100 fw-normal"
            id="assign-problem-category"
            formControlName="category"
          >
            @for (category of categoryOptions; track category) {
              <option [value]="category">{{ category }}</option>
            }
          </select>
          <img src="assets/problem-dialog/chevron-down.svg" alt="" aria-hidden="true" />
        </span>
      </div>

      <div class="assign-problem-dialog__field d-flex flex-column align-items-start w-100">
        <label class="w-100 text-start text-uppercase fw-semibold" for="assign-problem-task"
          >Task</label
        >
        <span class="assign-problem-dialog__select d-block w-100">
          <select class="d-block w-100 fw-normal" id="assign-problem-task" formControlName="task">
            @for (task of taskOptions; track task) {
              <option [value]="task">{{ task }}</option>
            }
          </select>
          <img src="assets/problem-dialog/chevron-down.svg" alt="" aria-hidden="true" />
        </span>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions
      class="assign-problem-dialog__footer d-flex align-items-center justify-content-between flex-nowrap m-0"
    >
      <button
        class="assign-problem-dialog__cancel d-flex align-items-center justify-content-center text-center text-nowrap fw-semibold"
        type="button"
        mat-dialog-close
      >
        Cancel
      </button>
      <button
        class="assign-problem-dialog__submit d-flex align-items-center justify-content-center text-center text-nowrap fw-semibold"
        type="submit"
      >
        Assign
      </button>
    </mat-dialog-actions>
  </form>
</section>
