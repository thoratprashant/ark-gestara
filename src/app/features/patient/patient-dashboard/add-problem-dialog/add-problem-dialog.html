<section class="add-problem-dialog w-100" aria-labelledby="add-problem-dialog-title">
  <header
    class="add-problem-dialog__header d-flex align-items-center justify-content-between m-0"
    mat-dialog-title
  >
    <h2 id="add-problem-dialog-title" class="m-0 text-start text-nowrap fw-bold">Add Problem</h2>
    <button
      class="d-flex align-items-center justify-content-center p-0 border-0"
      type="button"
      mat-dialog-close
      aria-label="Close Add Problem dialog"
    >
      <img src="assets/problem-dialog/close.svg" alt="" aria-hidden="true" />
    </button>
  </header>

  <form class="w-100" [formGroup]="form" (ngSubmit)="submit()">
    <mat-dialog-content class="add-problem-dialog__body d-flex flex-column align-items-start">
      <div class="add-problem-dialog__field d-flex flex-column align-items-start w-100">
        <label class="w-100 text-start text-uppercase fw-semibold" for="problem-name">
          Problem Name
        </label>
        <input
          class="w-100 text-start fw-normal"
          id="problem-name"
          type="text"
          formControlName="name"
          placeholder="Type here...."
        />
      </div>
    </mat-dialog-content>

    <mat-dialog-actions
      class="add-problem-dialog__footer d-flex align-items-center justify-content-between flex-nowrap m-0"
    >
      <button
        class="d-flex align-items-center justify-content-center text-center text-nowrap fw-semibold"
        type="button"
        mat-dialog-close
      >
        Cancel
      </button>
      <button
        class="add-problem-dialog__submit d-flex align-items-center justify-content-center text-center text-nowrap fw-semibold"
        type="submit"
      >
        Add Problem
      </button>
    </mat-dialog-actions>
  </form>
</section>
