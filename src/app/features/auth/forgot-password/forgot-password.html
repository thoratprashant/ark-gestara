<div class="auth-page">
  <div class="auth-page__stage">
    <div class="auth-page__content">
      <header class="auth-page__heading">
        <h1>Forgot Password</h1>
        <p>Enter your email to receive a reset link</p>
      </header>

      <div class="auth-page__body auth-page__body--narrow">
        <section class="auth-page__card" aria-label="Forgot password">
          <form
            class="auth-page__form"
            [formGroup]="forgotPasswordForm"
            (ngSubmit)="submit()"
            novalidate
          >
            <div class="auth-page__field">
              <label for="forgot-email">Email address</label>
              <mat-form-field appearance="outline" subscriptSizing="dynamic">
                <img matPrefix src="assets/auth/forgot-email.svg" alt="" width="16" height="16" />
                <input
                  matInput
                  id="forgot-email"
                  type="email"
                  formControlName="email"
                  placeholder="you@example.com"
                  autocomplete="email"
                />
                @if (forgotPasswordForm.controls.email.hasError('required')) {
                  <mat-error>Email is required.</mat-error>
                } @else if (forgotPasswordForm.controls.email.hasError('email')) {
                  <mat-error>Enter a valid email address.</mat-error>
                }
              </mat-form-field>
            </div>

            <button
              matButton="filled"
              type="submit"
              class="app-button app-button--auth-primary auth-page__submit"
            >
              Send reset link
            </button>
          </form>
        </section>

        <a class="auth-page__back" routerLink="/auth/login">
          <img src="assets/auth/forgot-back.svg" alt="" width="24" height="24" />
          <span>Back to sign in</span>
        </a>
      </div>
    </div>
  </div>

  <p class="auth-page__security">Protected by HIPAA-compliant security</p>
</div>
