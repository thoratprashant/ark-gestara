<main class="admin-profile-page">
  <section class="admin-profile-hero" aria-labelledby="admin-profile-name">
    <span class="admin-profile-hero__avatar">
      <img src="assets/admin/profile/profile-user.svg" alt="" />
    </span>

    <div class="admin-profile-hero__identity">
      <div class="admin-profile-hero__title">
        <h1 id="admin-profile-name">{{ profileForm.controls.fullName.value }}</h1>
        <span>Super Admin</span>
      </div>
      <p>Administrator <i aria-hidden="true">•</i> Gestara Healthcare Platform</p>
      <a href="mailto:{{ profileForm.controls.email.value }}">
        {{ profileForm.controls.email.value }}
      </a>
    </div>

    <button
      matButton="filled"
      class="app-button admin-profile-hero__edit-button"
      type="button"
      (click)="handleProfileAction()"
    >
      <img src="assets/admin/profile/edit-profile.svg" alt="" />
      <span>{{ isEditing() ? 'Save' : 'Edit Profile' }}</span>
    </button>
  </section>

  <form class="admin-profile-form" [formGroup]="profileForm">
    <section class="admin-profile-card" aria-labelledby="personal-information-title">
      <h2 id="personal-information-title">Personal Information</h2>

      <div class="admin-profile-fields">
        <div class="admin-field">
          <label class="admin-field__label" for="admin-profile-full-name">Full Name</label>
          <mat-form-field class="admin-form-field admin-profile-field" appearance="outline">
            <input
              id="admin-profile-full-name"
              matInput
              formControlName="fullName"
              autocomplete="name"
            />
          </mat-form-field>
        </div>

        <div class="admin-field">
          <label class="admin-field__label" for="admin-profile-email">Email Address</label>
          <mat-form-field class="admin-form-field admin-profile-field" appearance="outline">
            <input
              id="admin-profile-email"
              matInput
              type="email"
              formControlName="email"
              autocomplete="email"
            />
          </mat-form-field>
        </div>

        <div class="admin-field">
          <label class="admin-field__label" for="admin-profile-phone">Phone Number</label>
          <mat-form-field class="admin-form-field admin-profile-field" appearance="outline">
            <input
              id="admin-profile-phone"
              matInput
              type="tel"
              formControlName="phoneNumber"
              autocomplete="tel"
            />
          </mat-form-field>
        </div>

        <div class="admin-field">
          <label class="admin-field__label" for="admin-profile-department">Department</label>
          <mat-form-field class="admin-form-field admin-profile-field" appearance="outline">
            <input id="admin-profile-department" matInput formControlName="department" />
          </mat-form-field>
        </div>

        <div class="admin-field">
          <label class="admin-field__label" id="admin-profile-role-label">System Role</label>
          <mat-form-field
            class="admin-form-field admin-form-field--select admin-profile-field"
            appearance="outline"
          >
            <mat-select
              formControlName="systemRole"
              panelClass="admin-select-panel"
              aria-labelledby="admin-profile-role-label"
            >
              @for (role of systemRoles; track role) {
                <mat-option [value]="role">{{ role }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </section>

    <section
      class="admin-profile-card admin-profile-card--settings"
      aria-labelledby="account-settings-title"
    >
      <h2 id="account-settings-title">Account Settings</h2>
      <div class="admin-profile-card__actions">
        <button matButton="outlined" class="app-button admin-profile-card__action" type="button">
          Change Password
        </button>
        <button matButton="outlined" class="app-button admin-profile-card__action" type="button">
          Manage API Keys
        </button>
      </div>
    </section>
  </form>
</main>
