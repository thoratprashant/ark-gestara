<section class="add-checkbox-dialog" aria-labelledby="add-checkbox-item-title">
  <header class="add-checkbox-dialog__header">
    <h2 id="add-checkbox-item-title">Add Checkbox Item</h2>
    <button
      type="button"
      class="dialog-close"
      mat-dialog-close
      aria-label="Close add checkbox item dialog"
      matTooltip="Close"
    >
      <img src="assets/admin/icd-master/close.svg" alt="" width="18" height="18" />
    </button>
  </header>

  <form [formGroup]="form" (ngSubmit)="addItem()">
    <div class="add-checkbox-dialog__body">
      <div class="admin-field">
        <label class="admin-field__label" for="checkbox-item-name">Item Name</label>
        <mat-form-field class="admin-form-field" appearance="outline" subscriptSizing="dynamic">
          <input
            id="checkbox-item-name"
            matInput
            formControlName="name"
            placeholder="Enter item name..."
          />
        </mat-form-field>
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <span class="field-error" role="alert">Item name is required.</span>
        }
      </div>

      <div class="notes-field">
        <div>
          <strong>Requires Notes</strong>
          <span>Require a note when this item is completed</span>
        </div>
        <button
          type="button"
          class="dialog-toggle"
          [class.is-on]="form.controls.requiresNotes.value"
          [attr.aria-pressed]="form.controls.requiresNotes.value"
          aria-label="Toggle requires notes"
          (click)="toggleNotes()"
        >
          <i aria-hidden="true"></i>{{ form.controls.requiresNotes.value ? 'Yes' : 'No' }}
        </button>
      </div>

      <div class="admin-field sequence-field">
        <label class="admin-field__label" for="checkbox-item-sequence">Sequence</label>
        <mat-form-field class="admin-form-field" appearance="outline" subscriptSizing="dynamic">
          <input
            id="checkbox-item-sequence"
            matInput
            type="number"
            min="1"
            formControlName="sequence"
          />
        </mat-form-field>
      </div>
    </div>

    <footer class="add-checkbox-dialog__footer">
      <button matButton="filled" type="button" class="app-button app-button--secondary" mat-dialog-close>
        Cancel
      </button>
      <button matButton="filled" type="submit" class="app-button app-button--primary">
        Add Item
      </button>
    </footer>
  </form>
</section>
