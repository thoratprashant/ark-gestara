<section class="assign-dialog" aria-labelledby="assign-problems-title">
  <header class="assign-dialog__header">
    <h2 id="assign-problems-title">Assign Problems</h2>
    <button
      type="button"
      class="assign-dialog__close"
      mat-dialog-close
      aria-label="Close assign problems dialog"
      matTooltip="Close"
    >
      <img src="assets/admin/icd-master/close.svg" alt="" width="16" height="16" />
    </button>
  </header>

  <div class="assign-dialog__search">
    <label class="visually-hidden" for="problem-assignment-search">Search problems</label>
    <img src="assets/admin/providers/search.svg" alt="" width="18" height="18" />
    <input
      id="problem-assignment-search"
      type="search"
      placeholder="Search problems by name or code..."
      [ngModel]="query()"
      (ngModelChange)="query.set($event)"
    />
  </div>

  <div class="assign-dialog__table" tabindex="0" role="region" aria-label="Problem selector">
    <table>
      <thead>
        <tr>
          <th scope="col">Problem Name</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        @for (problem of filtered(); track problem.id) {
          <tr [class.is-selected]="selectedIds().has(problem.id)">
            <td
              class="assign-dialog__select-cell"
              role="button"
              tabindex="0"
              [attr.aria-label]="'Select ' + problem.name"
              [attr.aria-pressed]="selectedIds().has(problem.id)"
              (click)="toggle(problem)"
              (keydown.enter)="toggle(problem)"
              (keydown.space)="toggle(problem); $event.preventDefault()"
            >
              <button
                type="button"
                class="assign-check"
                [class.is-selected]="selectedIds().has(problem.id)"
                [attr.aria-pressed]="selectedIds().has(problem.id)"
                [attr.aria-label]="'Select ' + problem.name"
                (click)="toggle(problem); $event.stopPropagation()"
              ></button>
              <span>{{ problem.code }} - {{ problem.name }}</span>
            </td>
            <td>
              <span class="assign-status" [attr.data-status]="problem.status">{{
                problem.status
              }}</span>
            </td>
          </tr>
        } @empty {
          <tr class="assign-dialog__empty-row">
            <td colspan="2">
              <div class="assign-dialog__empty-state">
                <strong>No record found</strong>
                <span>Try another problem name or code.</span>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <footer class="assign-dialog__footer">
    <span>{{ selectedIds().size }} of {{ problems.length }} items selected for assignment</span>
    <div>
      <button
        matButton="filled"
        type="button"
        class="app-button app-button--secondary"
        mat-dialog-close
      >
        Cancel
      </button>
      <button
        matButton="filled"
        type="button"
        class="app-button app-button--primary"
        (click)="assign()"
      >
        Assign Selected ({{ selectedIds().size }})
      </button>
    </div>
  </footer>
</section>
