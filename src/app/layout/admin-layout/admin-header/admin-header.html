<header class="admin-header">
  <button
    class="admin-header__menu"
    type="button"
    aria-label="Open navigation"
    (click)="menuClick.emit()"
  >
    <span></span><span></span><span></span>
  </button>

  <button
    class="admin-header__account"
    type="button"
    aria-label="Open account menu"
    [matMenuTriggerFor]="accountMenu"
  >
    <span class="admin-header__avatar">
      <img src="assets/admin/user.svg" alt="" width="16" height="16" />
    </span>
    <div class="admin-header__identity">
      <strong>Dr. Admin</strong>
      <span>Administrator</span>
    </div>
    <mat-icon class="admin-header__account-chevron" aria-hidden="true">
      keyboard_arrow_down
    </mat-icon>
  </button>

  <mat-menu #accountMenu="matMenu" panelClass="admin-account-menu" xPosition="before">
    <button mat-menu-item type="button" disableRipple routerLink="/admin/profile">
      <span class="admin-account-menu__icon">
        <img src="assets/admin/profile.svg" alt="" />
      </span>
      <span>Profile</span>
    </button>
    <button
      mat-menu-item
      type="button"
      disableRipple
      routerLink="/auth/login"
      (click)="logoutClick.emit()"
    >
      <span class="admin-account-menu__icon">
        <img class="admin-account-menu__sign-out-icon" src="assets/admin/sign-out.svg" alt="" />
      </span>
      <span>Sign Out</span>
    </button>
  </mat-menu>
</header>
