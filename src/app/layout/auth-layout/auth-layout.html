<main class="auth-shell">
  @if (splashVisible()) {
    <section class="auth-splash" role="status" aria-label="Loading Gestara sign in">
      <span class="auth-splash__halo" aria-hidden="true"></span>

      <div class="auth-splash__brand">
        <img
          class="auth-splash__mark"
          src="assets/logo-1.png"
          alt=""
          width="89"
          height="86"
          fetchpriority="high"
        />

        <div class="auth-splash__wordmark-column">
          <img
            class="auth-splash__wordmark"
            src="assets/logo-2.png"
            alt="Gestara, every milestone perfectly timed"
            width="269"
            height="87"
            fetchpriority="high"
          />
          <span class="auth-splash__line" aria-hidden="true"></span>
        </div>
      </div>

      <span class="visually-hidden">Preparing your secure sign in</span>
    </section>
  }

  <span class="auth-shell__glow auth-shell__glow--top" aria-hidden="true"></span>
  <span class="auth-shell__glow auth-shell__glow--middle" aria-hidden="true"></span>
  <span class="auth-shell__glow auth-shell__glow--bottom" aria-hidden="true"></span>

  <section class="auth-shell__brand" aria-label="Gestara">
    <img
      class="auth-shell__logo"
      src="assets/auth/gestara-logo.png"
      alt="Gestara, every milestone perfectly timed"
      width="356"
      height="86"
      fetchpriority="high"
    />
  </section>

  <section class="auth-shell__content">
    <img
      class="auth-shell__mobile-logo"
      src="assets/auth/gestara-logo.png"
      alt="Gestara, every milestone perfectly timed"
      width="280"
      height="68"
    />
    <router-outlet />
  </section>
</main>
