<main class="auth-shell">
  <span class="auth-shell__glow auth-shell__glow--top" aria-hidden="true"></span>
  <span class="auth-shell__glow auth-shell__glow--middle" aria-hidden="true"></span>
  <span class="auth-shell__glow auth-shell__glow--bottom" aria-hidden="true"></span>

  <section class="auth-shell__brand" aria-label="Gestara">
    <img
      class="auth-shell__logo"
      src="assets/auth/gestara-logo.png"
      alt="Gestara, every milestone perfectly timed"
      width="356"
      height="86"
      fetchpriority="high"
    />
  </section>

  <section class="auth-shell__content">
    <img
      class="auth-shell__mobile-logo"
      src="assets/auth/gestara-logo.png"
      alt="Gestara, every milestone perfectly timed"
      width="280"
      height="68"
    />
    <router-outlet />
  </section>
</main>
