<div
  class="patient-layout d-flex flex-column min-vh-100"
  [class.patient-layout--header-compact]="headerCompact()"
>
  <header class="patient-header">
    <a class="logo-panel" routerLink="/patient/dashboard" aria-label="Gestara patient dashboard">
      <img class="gestara-logo" src="assets/logo.svg" alt="" />
    </a>

    <div class="header-main">
      <nav class="primary-nav" aria-label="Patient navigation">
        <a
          class="nav-link"
          routerLink="/patient/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
        >
          <img src="assets/header/home.svg" alt="" />
          <span>Dashboard</span>
        </a>

        <a
          class="nav-link"
          routerLink="/patient/previous-visits"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
        >
          <img src="assets/header/calendar.svg" alt="" />
          <span>Previous Visits</span>
        </a>

        <a
          class="nav-link"
          routerLink="/patient/future-visits"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
        >
          <img src="assets/header/calendar.svg" alt="" />
          <span>Future Visits</span>
        </a>
      </nav>

      <div class="header-actions">
        <div class="quick-stats-wrap">
          <button
            class="quick-stats"
            type="button"
            aria-label="Show quick stats"
            aria-describedby="quick-stats-popover"
          >
            <span class="quick-stats-label">Quick Stats</span>
            <img src="assets/header/info.svg" alt="" />
          </button>

          <div id="quick-stats-popover" class="quick-stats-popover" role="status">
            <p class="quick-stats-popover__title">Quick Stats</p>
            <dl class="quick-stats-popover__list">
              <div>
                <dt>Prenatal Visits</dt>
                <dd>10</dd>
              </div>
              <div>
                <dt>Upcoming</dt>
                <dd>8</dd>
              </div>
              <div>
                <dt>Labs Pending</dt>
                <dd class="quick-stats-popover__alert">2</dd>
              </div>
            </dl>
          </div>
        </div>

        <button
          class="mobile-menu-toggle"
          type="button"
          aria-label="Open patient navigation"
          aria-controls="patient-mobile-sidebar"
          [attr.aria-expanded]="sidebarOpen()"
          (click)="toggleSidebar()"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  @if (sidebarOpen()) {
    <button
      class="sidebar-backdrop"
      type="button"
      aria-label="Close patient navigation"
      (click)="closeSidebar()"
    ></button>
  }

  <aside
    id="patient-mobile-sidebar"
    class="mobile-sidebar"
    [class.open]="sidebarOpen()"
    [attr.aria-hidden]="!sidebarOpen()"
    [attr.inert]="sidebarOpen() ? null : ''"
  >
    <div class="mobile-sidebar-header">
      <a
        class="sidebar-brand"
        routerLink="/patient/dashboard"
        aria-label="Gestara patient dashboard"
        (click)="closeSidebar()"
      >
        <img class="gestara-logo" src="assets/logo.svg" alt="" />
      </a>

      <button
        class="sidebar-close"
        type="button"
        aria-label="Close navigation"
        (click)="closeSidebar()"
      >
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="mobile-nav" aria-label="Mobile patient navigation">
      <a
        class="nav-link"
        routerLink="/patient/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="closeSidebar()"
      >
        <img src="assets/header/home.svg" alt="" />
        <span>Dashboard</span>
      </a>

      <a
        class="nav-link"
        routerLink="/patient/previous-visits"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="closeSidebar()"
      >
        <img src="assets/header/calendar.svg" alt="" />
        <span>Previous Visits</span>
      </a>

      <a
        class="nav-link"
        routerLink="/patient/future-visits"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="closeSidebar()"
      >
        <img src="assets/header/calendar.svg" alt="" />
        <span>Future Visits</span>
      </a>
    </nav>
  </aside>

  <main class="patient-content container-fluid flex-grow-1 py-4">
    <router-outlet />
  </main>
</div>
