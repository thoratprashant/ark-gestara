<div
  class="institution-admin-shell"
  [class.institution-admin-shell--mobile-open]="mobileNavigationOpen()"
  [class.institution-admin-shell--collapsed]="sidebarCollapsed()"
>
  <aside
    class="institution-admin-sidebar"
    [class.institution-admin-sidebar--dashboard]="isDashboardPage()"
    aria-label="Institution admin navigation"
  >
    <div class="institution-admin-sidebar__logo">
      <span class="institution-admin-sidebar__logo-crop">
        <img src="assets/institution-admin/logo.png" alt="Gestara" />
      </span>
    </div>

    <nav class="institution-admin-sidebar__nav">
      @if (profileState.profileCompleted()) {
        <a
          class="institution-admin-sidebar__link"
          routerLink="/institution-admin/dashboard"
          routerLinkActive="institution-admin-sidebar__link--active"
          (click)="closeMobileNavigation()"
        >
          <img
            src="assets/institution-admin/dashboard/dashboard-active.svg"
            alt=""
            width="20"
            height="20"
          />
          <span>Dashboard</span>
        </a>
      } @else {
        <button
          class="institution-admin-sidebar__link institution-admin-sidebar__link--disabled"
          type="button"
          disabled
          aria-disabled="true"
          title="Complete Profile Setup to unlock Dashboard"
        >
          <img src="assets/institution-admin/dashboard.svg" alt="" width="20" height="20" />
          <span>Dashboard</span>
          <img
            class="institution-admin-sidebar__lock"
            src="assets/institution-admin/lock.svg"
            alt="Locked"
            width="12"
            height="12"
          />
        </button>
      }

      @if (!isDashboardPage()) {
        <a
          class="institution-admin-sidebar__link"
          routerLink="/institution-admin/profile-setup"
          routerLinkActive="institution-admin-sidebar__link--active"
          (click)="closeMobileNavigation()"
        >
          <img src="assets/institution-admin/profile-setup.svg" alt="" width="20" height="20" />
          <span>Profile Setup</span>
        </a>
      }
    </nav>

    @if (isDashboardPage()) {
      <button
        class="institution-admin-sidebar__collapse"
        type="button"
        [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        [title]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        (click)="toggleSidebar()"
      >
        <img src="assets/institution-admin/dashboard/collapse.svg" alt="" width="16" height="16" />
        <span>Collapse</span>
      </button>
    }
  </aside>

  <header class="institution-admin-header">
    <button
      class="institution-admin-header__menu"
      type="button"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="mobileNavigationOpen()"
      (click)="toggleMobileNavigation()"
    >
      <span></span><span></span><span></span>
    </button>

    <div class="institution-admin-header__account">
      <span class="institution-admin-header__avatar">
        <img src="assets/institution-admin/user.svg" alt="" width="16" height="16" />
      </span>
      <span class="institution-admin-header__identity">
        <strong>Sarah Mitchell</strong>
        <small>Institution Admin</small>
      </span>
    </div>
  </header>

  @if (mobileNavigationOpen()) {
    <button
      class="institution-admin-shell__backdrop"
      type="button"
      aria-label="Close navigation"
      (click)="closeMobileNavigation()"
    ></button>
  }

  <main class="institution-admin-shell__content" id="institution-admin-main-content">
    <router-outlet />
  </main>
</div>
